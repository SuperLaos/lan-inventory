{% extends 'mobile/base.html' %}
{% block title %}修改密码{% endblock %}
{% block mtitle %}修改密码{% endblock %}
{% block content %}
<div class="m-card">
  {% if error %}<div class="m-alert m-alert-error">{{ error }}</div>{% endif %}
  {% if user and user.force_change_password == '1' %}
  <div class="m-alert m-alert-warn">⚠️ 首次登录（或密码已被管理员重置），必须先修改密码才能使用系统。</div>
  {% endif %}
  <form method="post">
    <label class="m-lab">新密码<span class="req">*</span></label>
    <input class="m-input" type="password" name="new_pwd" required minlength="4" placeholder="至少 4 位">
    <label class="m-lab">确认新密码<span class="req">*</span></label>
    <input class="m-input" type="password" name="confirm_pwd" required minlength="4" placeholder="再输入一次">
    <button type="submit" class="m-btn m-btn-primary" style="margin-top:20px">确认修改</button>
  </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block guest %}
<div class="login-box">
  <h2>物料仓库进销存系统</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="user_name" required autofocus placeholder="请输入用户名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" required placeholder="请输入密码">
    </div>
    <button type="submit" class="btn">登 录</button>
  </form>
</div>
{% endblock %}

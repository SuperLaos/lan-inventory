{% extends 'base.html' %}
{% block title %}表单维护{% endblock %}
{% block content %}
<h2>表单维护（字典数据）</h2>
<div class="alert alert-error" style="background:#fff7e6;border-color:#ffd591;color:#ad6800">
  ⚠️ 仅系统管理员可操作。此处只维护字典数据（部门 / 大类 / 计量单位 / 供应商），
  库存与出入库流水等业务数据必须通过入库/出库/盘点功能修改，否则会账实不符。
</div>

<div class="tabs" id="form-tabs">
  <a href="#" data-tab="dept" class="{% if tab == 'dept' %}active{% endif %}">部门</a>
  <a href="#" data-tab="category" class="{% if tab == 'category' %}active{% endif %}">大类</a>
  <a href="#" data-tab="unit" class="{% if tab == 'unit' %}active{% endif %}">计量单位</a>
  <a href="#" data-tab="supplier" class="{% if tab == 'supplier' %}active{% endif %}">供应商</a>
</div>

<div class="card">
  <p style="margin-bottom:14px"><button class="btn btn-sm" onclick="openAdd()">＋ 新增</button></p>
  <table id="dict-table">
    <tr><th>名称</th><th>操作</th></tr>
  </table>
</div>

<div class="modal-mask" id="modal-mask"></div>
<div class="modal" id="modal" style="display:none">
  <h3 id="modal-title">新增</h3>
  <div class="form-group">
    <label id="modal-label">名称</label>
    <input type="text" id="modal-name">
  </div>
  <div style="text-align:right;margin-top:18px">
    <button class="btn btn-sm" style="background:#999" onclick="closeModal()">取消</button>
    <button class="btn btn-sm btn-success" onclick="submitModal()">保存</button>
  </div>
</div>

<script>
var LABELS = {dept:'部门', category:'大类', unit:'计量单位', supplier:'供应商'};
var curTab = '{{ tab or "category" }}';
var editId = null;

document.querySelectorAll('#form-tabs a').forEach(function(a) {
  a.onclick = function(e) {
    e.preventDefault();
    curTab = a.dataset.tab;
    document.querySelectorAll('#form-tabs a').forEach(function(x) {
      x.classList.toggle('active', x.dataset.tab === curTab);
    });
    loadList();
  };
});

function loadList() {
  fetch('{{ url_for("api_forms_list", kind="__X__") }}'.replace('__X__', curTab))
    .then(function(r){ return r.json(); })
    .then(function(list) {
      var tbl = document.getElementById('dict-table');
      var idf = (curTab === 'dept') ? 'dept_id' : (curTab === 'category' ? 'category_id' : (curTab === 'unit' ? 'unit_id' : 'supplier_id'));
      var nf = (curTab === 'dept') ? 'dept_name' : (curTab === 'category' ? 'category_name' : (curTab === 'unit' ? 'unit_name' : 'supplier_name'));
      var html = '<tr><th>名称</th><th>操作</th></tr>';
      list.forEach(function(r) {
        html += '<tr><td>' + r[nf] + '</td><td>' +
          '<button class="btn btn-sm" onclick="openEdit(\'' + r[idf] + '\', \'' + r[nf].replace(/'/g, "\\'") + '\')">修改</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="tryDelete(\'' + r[idf] + '\')">删除</button></td></tr>';
      });
      tbl.innerHTML = html;
    });
}

function openModal() {
  document.getElementById('modal-mask').style.display = 'block';
  document.getElementById('modal').style.display = 'block';
}
function closeModal() {
  document.getElementById('modal-mask').style.display = 'none';
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modal-name').value = '';
  editId = null;
}
function openAdd() {
  editId = null;
  document.getElementById('modal-title').textContent = '新增' + LABELS[curTab];
  document.getElementById('modal-label').textContent = LABELS[curTab] + '名称';
  openModal();
}
function openEdit(id, name) {
  editId = id;
  document.getElementById('modal-title').textContent = '修改' + LABELS[curTab];
  document.getElementById('modal-label').textContent = LABELS[curTab] + '名称';
  document.getElementById('modal-name').value = name;
  openModal();
}
function submitModal() {
  var name = document.getElementById('modal-name').value.trim();
  if (!name) { alert('名称不能为空'); return; }
  var url = '{{ url_for("api_forms_add", kind="__X__") }}'.replace('__X__', curTab);
  var method = 'POST';
  if (editId) {
    url = '{{ url_for("api_forms_edit", kind="__X__", rid="__Y__") }}'.replace('__X__', curTab).replace('__Y__', editId);
  }
  fetch(url, {
    method: method,
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name})
  }).then(function(r){ return r.json(); })
    .then(function(j) {
      if (j.ok) { closeModal(); loadList(); }
      else alert(j.msg || '操作失败');
    });
}
function tryDelete(id) {
  var url = '{{ url_for("api_forms_check_delete", kind="__X__", rid="__Y__") }}'.replace('__X__', curTab).replace('__Y__', id);
  fetch(url).then(function(r){ return r.json(); })
    .then(function(j) {
      if (!j.ok) { alert(j.msg); return; }
      if (!confirm('确认删除？此操作会自动备份，但建议谨慎。')) return;
      var durl = '{{ url_for("api_forms_delete", kind="__X__", rid="__Y__") }}'.replace('__X__', curTab).replace('__Y__', id);
      fetch(durl, {method: 'POST'}).then(function(r){ return r.json(); })
        .then(function(j2) {
          if (j2.ok) loadList(); else alert(j2.msg || '删除失败');
        });
    });
}
loadList();
</script>
{% endblock %}

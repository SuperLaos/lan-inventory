{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<h2>修改密码</h2>
<div class="card" style="max-width:480px">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if user and user.force_change_password == '1' %}
  <div class="alert alert-error">⚠️ 首次登录（或密码已被管理员重置），必须先修改密码才能使用系统。</div>
  {% endif %}
  <form method="post">
    <div class="form-group">
      <label>新密码<span class="req">*</span></label>
      <input type="password" name="new_pwd" required minlength="4" placeholder="至少 4 位">
    </div>
    <div class="form-group">
      <label>确认新密码<span class="req">*</span></label>
      <input type="password" name="confirm_pwd" required minlength="4">
    </div>
    <div class="form-group">
      <label></label>
      <button type="submit" class="btn">确认修改</button>
    </div>
  </form>
</div>
{% endblock %}
